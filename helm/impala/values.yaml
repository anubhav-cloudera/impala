image:
  # Optional prefix for published images, e.g. "apache/impala:81d5377c2-"
  # Leave empty to use locally built image names like "statestored".
  prefix: ""
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClassName: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

impalad:
  memLimit: "8gb"
  javaToolOptions: "-Xmx2g"
  defaultQueryOptions: "mt_dop=4,default_file_format=parquet,default_transactional_type=insert_only"
  mtDopAutoFallback: true
  rpcUseLoopback: false
  # Optional Kudu master hosts. Set to enable Kudu integration.
  kuduMasterHosts: ""
  extraArgs: []

catalogd:
  hmsEventPollingIntervalS: 1
  invalidateTablesTimeoutS: 999999
  extraArgs: []

statestored:
  extraArgs: []

hms:
  extraArgs: []

nodeSelector: {}
tolerations: []
affinity: {}

statestore:
  host: ""

catalog:
  host: ""

auth:
  tls:
    enabled: false
    # TLS secret with keys: tls.crt, tls.key, ca.crt
    secretName: impala-tls
    certFile: tls.crt
    keyFile: tls.key
    caFile: ca.crt
  ldap:
    enabled: false
    uri: ""
    baseDN: ""
    userSearchBaseDN: ""
    bindDN: ""
    # Secret containing the LDAP bind password.
    bindPasswordSecret: impala-ldap-bind
    bindPasswordKey: bind_password
    # Optional: create the bind password secret from values.
    bindPasswordSecretCreate: false
    bindPassword: ""
    # Non-prod override for plain LDAP (no TLS). Impala will exit without this.
    allowCleartextPassword: true
    # TLS settings for LDAP (ldaps:// or STARTTLS).
    tlsEnabled: false
    caFile: ""
    caSecretName: ""
    userFilter: ""
    groupFilter: ""
    searchBindAuthentication: true
  ranger:
    enabled: false
    # Enables Impala's Ranger authorization provider. Requires Ranger admin config.
    serviceType: "hive"
    appId: "impala"
    serverName: "server1"
    extraArgs: []

ldapServer:
  enabled: false
  image: osixia/openldap:1.5.0
  organisation: "Impala"
  domain: "example.com"
  adminPassword: "admin"
  configPassword: "config"
  tls:
    enabled: false
    # Secret with keys: tls.crt, tls.key, ca.crt
    secretName: impala-ldap-tls
    certFile: tls.crt
    keyFile: tls.key
    caFile: ca.crt
  seedUser:
    uid: impalauser
    password: impala123
    givenName: Impala
    sn: User
  persistence:
    enabled: false
    size: 2Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""

ranger:
  enabled: false
  # Ranger admin image (provide when enabling)
  image: ""
  imagePullPolicy: IfNotPresent
  adminPort: 6080
  service:
    type: ClusterIP
    port: 6080
  env: {}

kudu:
  enabled: false
  image: apache/kudu:1.17.0
  master:
    replicas: 1
    rpcPort: 7051
    webPort: 8051
    extraArgs:
      - --default_num_replicas=1
      - --rpc_authentication=disabled
      - --rpc_encryption=disabled
    resources: {}
    persistence:
      enabled: false
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
  tserver:
    replicas: 1
    rpcPort: 7050
    webPort: 8050
    extraArgs:
      - --rpc_authentication=disabled
      - --rpc_encryption=disabled
    resources: {}
    persistence:
      enabled: false
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: ""

tcpIngress:
  enabled: false
  namespace: ingress-nginx
  configMapName: tcp-services
  # Optional explicit mappings. If empty, defaults to impalad 21000/21050.
  # serviceName supports templating, e.g. "{{ include \"impala.fullname\" . }}-impalad"
  mappings: []