apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "impala.fullname" . }}-impalad
  labels:
{{ include "impala.labels" . | indent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "impala.fullname" . }}-impalad
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "impala.name" . }}
      app.kubernetes.io/component: impalad
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "impala.name" . }}
        app.kubernetes.io/component: impalad
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: impalad
          image: {{ include "impala.image" (dict "Values" .Values "imageName" "impalad_coord_exec") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -v=1
            - -redirect_stdout_stderr=false
            - -logtostderr
            - -state_store_host={{ .Values.statestore.host | default (printf "%s-statestored" (include "impala.fullname" .)) }}
            - -catalog_service_host={{ .Values.catalog.host | default (printf "%s-catalogd" (include "impala.fullname" .)) }}
{{- if .Values.auth.tls.enabled }}
            - -ssl_server_certificate=/etc/impala/tls/{{ .Values.auth.tls.certFile }}
            - -ssl_private_key=/etc/impala/tls/{{ .Values.auth.tls.keyFile }}
{{- if .Values.auth.tls.caFile }}
            - -ssl_client_ca_certificate=/etc/impala/tls/{{ .Values.auth.tls.caFile }}
{{- end }}
{{- end }}
{{- if .Values.auth.ldap.enabled }}
            - -enable_ldap_auth=true
            - -ldap_uri={{ .Values.auth.ldap.uri }}
            - -ldap_baseDN={{ .Values.auth.ldap.baseDN }}
            - -ldap_bind_dn={{ .Values.auth.ldap.bindDN }}
            - -ldap_bind_password_cmd=cat /etc/impala/ldap/{{ .Values.auth.ldap.bindPasswordKey }}
            - -ldap_search_bind_authentication={{ .Values.auth.ldap.searchBindAuthentication | default true }}
{{- if .Values.auth.ldap.allowCleartextPassword }}
            - -ldap_passwords_in_clear_ok=true
{{- end }}
{{- if .Values.auth.ldap.tlsEnabled }}
            - -ldap_tls=true
{{- if .Values.auth.ldap.caFile }}
            - -ldap_ca_certificate=/etc/impala/ldap-ca/{{ .Values.auth.ldap.caFile }}
{{- end }}
{{- end }}
{{- if .Values.auth.ldap.userSearchBaseDN }}
            - -ldap_user_search_basedn={{ .Values.auth.ldap.userSearchBaseDN }}
{{- end }}
{{- if .Values.auth.ldap.userFilter }}
            - -ldap_user_filter={{ .Values.auth.ldap.userFilter }}
{{- end }}
{{- if .Values.auth.ldap.groupFilter }}
            - -ldap_group_filter={{ .Values.auth.ldap.groupFilter }}
{{- end }}
{{- end }}
{{- if .Values.auth.ranger.enabled }}
            - -authorization_provider=ranger
            - -ranger_service_type={{ .Values.auth.ranger.serviceType }}
            - -ranger_app_id={{ .Values.auth.ranger.appId }}
            - -server-name={{ .Values.auth.ranger.serverName }}
{{- range .Values.auth.ranger.extraArgs }}
            - {{ . | quote }}
{{- end }}
{{- end }}
{{- $kudu := default dict .Values.kudu -}}
{{- $kuduMaster := default dict $kudu.master -}}
{{- if or .Values.impalad.kuduMasterHosts $kudu.enabled }}
            - -kudu_master_hosts={{ .Values.impalad.kuduMasterHosts | default (printf "%s:%v" (include "impala.kuduMasterService" .) (default 7051 $kuduMaster.rpcPort)) }}
{{- end }}
            - -mt_dop_auto_fallback={{ .Values.impalad.mtDopAutoFallback | default true }}
            - -default_query_options={{ .Values.impalad.defaultQueryOptions }}
            - -mem_limit={{ .Values.impalad.memLimit }}
            - -rpc_use_loopback={{ .Values.impalad.rpcUseLoopback | default false }}
{{- range .Values.impalad.extraArgs }}
            - {{ . | quote }}
{{- end }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.impalad.javaToolOptions | quote }}
          ports:
            - name: beeswax
              containerPort: 21000
            - name: hs2
              containerPort: 21050
            - name: web
              containerPort: 25000
            - name: hs2-http
              containerPort: 28000
          volumeMounts:
            - name: warehouse
              mountPath: /user/hive/warehouse
            - name: conf
              mountPath: /opt/impala/conf/hive-site.xml
              subPath: hive-site.xml
{{- if .Values.auth.tls.enabled }}
            - name: tls
              mountPath: /etc/impala/tls
              readOnly: true
{{- end }}
{{- if .Values.auth.ldap.enabled }}
            - name: ldap
              mountPath: /etc/impala/ldap
              readOnly: true
{{- end }}
{{- if and .Values.auth.ldap.enabled .Values.auth.ldap.tlsEnabled .Values.auth.ldap.caFile }}
            - name: ldap-ca
              mountPath: /etc/impala/ldap-ca
              readOnly: true
{{- end }}
      volumes:
        - name: conf
          configMap:
            name: {{ include "impala.fullname" . }}-conf
        - name: warehouse
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "impala.fullname" . }}-warehouse
{{- else }}
          emptyDir: {}
{{- end }}
{{- if .Values.auth.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.auth.tls.secretName }}
{{- end }}
{{- if .Values.auth.ldap.enabled }}
        - name: ldap
          secret:
            secretName: {{ .Values.auth.ldap.bindPasswordSecret }}
{{- end }}
{{- if and .Values.auth.ldap.enabled .Values.auth.ldap.tlsEnabled .Values.auth.ldap.caFile }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.auth.ldap.caSecretName | default .Values.ldapServer.tls.secretName }}
{{- end }}