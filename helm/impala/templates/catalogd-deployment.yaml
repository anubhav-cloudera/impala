apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "impala.fullname" . }}-catalogd
  labels:
{{ include "impala.labels" . | indent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "impala.fullname" . }}-catalogd
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "impala.name" . }}
      app.kubernetes.io/component: catalogd
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "impala.name" . }}
        app.kubernetes.io/component: catalogd
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: catalogd
          image: {{ include "impala.image" (dict "Values" .Values "imageName" "catalogd") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -redirect_stdout_stderr=false
            - -logtostderr
            - -v=1
            - -state_store_host={{ .Values.statestore.host | default (printf "%s-statestored" (include "impala.fullname" .)) }}
{{- $kudu := default dict .Values.kudu -}}
{{- $kuduMaster := default dict $kudu.master -}}
{{- if or .Values.impalad.kuduMasterHosts $kudu.enabled }}
            - -kudu_master_hosts={{ .Values.impalad.kuduMasterHosts | default (printf "%s:%v" (include "impala.kuduMasterService" .) (default 7051 $kuduMaster.rpcPort)) }}
{{- end }}
            - -hms_event_polling_interval_s={{ .Values.catalogd.hmsEventPollingIntervalS }}
            - -invalidate_tables_timeout_s={{ .Values.catalogd.invalidateTablesTimeoutS }}
{{- if .Values.auth.tls.enabled }}
            - -ssl_server_certificate=/etc/impala/tls/{{ .Values.auth.tls.certFile }}
            - -ssl_private_key=/etc/impala/tls/{{ .Values.auth.tls.keyFile }}
{{- if .Values.auth.tls.caFile }}
            - -ssl_client_ca_certificate=/etc/impala/tls/{{ .Values.auth.tls.caFile }}
{{- end }}
{{- end }}
{{- if .Values.auth.ranger.enabled }}
            - -authorization_provider=ranger
            - -ranger_service_type={{ .Values.auth.ranger.serviceType }}
            - -ranger_app_id={{ .Values.auth.ranger.appId }}
            - -server-name={{ .Values.auth.ranger.serverName }}
{{- range .Values.auth.ranger.extraArgs }}
            - {{ . | quote }}
{{- end }}
{{- end }}
{{- range .Values.catalogd.extraArgs }}
            - {{ . | quote }}
{{- end }}
          ports:
            - name: rpc
              containerPort: 26000
            - name: web
              containerPort: 25020
          volumeMounts:
            - name: warehouse
              mountPath: /user/hive/warehouse
            - name: conf
              mountPath: /opt/impala/conf/hive-site.xml
              subPath: hive-site.xml
{{- if .Values.auth.tls.enabled }}
            - name: tls
              mountPath: /etc/impala/tls
              readOnly: true
{{- end }}
      volumes:
        - name: conf
          configMap:
            name: {{ include "impala.fullname" . }}-conf
        - name: warehouse
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "impala.fullname" . }}-warehouse
{{- else }}
          emptyDir: {}
{{- end }}
{{- if .Values.auth.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.auth.tls.secretName }}
{{- end }}